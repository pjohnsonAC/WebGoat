name: Security Scan

on:
  workflow_dispatch:
    inputs:
      run_dependency_check:
        description: "Run OWASP Dependency-Check. This can take a long time on first run."
        required: false
        default: "false"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Open source scanner baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install scanners
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install semgrep
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b .tools
          curl -sfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/scripts/install.sh | sh -s -- -b .tools
          echo "$PWD/.tools" >> "$GITHUB_PATH"

      - name: Run scanners
        env:
          RUN_DEPENDENCY_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.run_dependency_check || 'false' }}
        run: bash scripts/security-scan.sh

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep

      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn
